<!DOCTYPE html>

                        "tertiary": "#4d556b",
                        "error-container": "#ffdad6",
                        "primary-container": "#2563eb",
                        "surface": "#faf8ff",
                        "secondary": "#505f76",
                        "on-error-container": "#93000a",
                        "inverse-surface": "#2e3039",
                        "surface-container-highest": "#e1e2ed",

                        "on-secondary": "#ffffff"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",

                    spacing: {

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;

<body class="bg-background text-on-background min-h-screen flex items-center justify-center font-body-md text-body-md antialiased p-margin-mobile md:p-margin-desktop">
<!-- Login Container -->
<main class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl shadow-[0_10px_15px_-3px_rgba(0,0,0,0.1),_0_4px_6px_-4px_rgba(0,0,0,0.1)] border border-outline-variant/30 p-stack-lg md:p-10 relative overflow-hidden">
<!-- Subtle decorative element -->
<div class="absolute -top-16 -right-16 w-32 h-32 bg-primary-fixed rounded-full blur-3xl opacity-40 pointer-events-none"></div>
<!-- Header -->
<div class="flex flex-col items-center mb-stack-lg relative z-10">
<img alt="Ujiankuuu Logo" class="w-16 h-16 mb-4 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB5F64IKWtnjZzy6BmXX5Nz90MvmRzkyr5_uuC7bUe6X1YIPj4p6EKoS5bPIZAVHo_3UulBuCfZ1qtU6HVeXM_eZCzXpjydB0_RTaBUfaQxdIX387Da2iiwhnR2tfumwT82FzYqu9SjDw1EcC5iCz8NjYJlHGU-l5DdPyOOd1VsEBpllt1Cqnyt1up7S7F4cp-jFsxiLRlVtyDcKJAyaks1bXh7-0N2_hAx-aH9dL2_5YtRBJuCN-Nk2A"/>
<h1 class="font-headline-md text-headline-md text-on-surface text-center">Masuk ke Ujiankuuu</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-2 text-center">Portal Ujian SMK Jakarta Pusat 1</p>
</div>
<!-- Form -->
<form class="space-y-stack-md relative z-10">
<!-- Email/Username Field -->
<div>
<label class="block font-title-sm text-title-sm text-on-surface mb-2" for="identifier">Email atau Username</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">person</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container hover:bg-surface-container-high focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary focus:border-primary border-transparent rounded-lg font-body-md text-body-md text-on-surface transition-colors placeholder:text-outline" id="identifier" name="identifier" placeholder="Masukkan email atau username" required="" type="text"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-title-sm text-title-sm text-on-surface mb-2" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">lock</span>
<input class="w-full pl-10 pr-10 py-3 bg-surface-container hover:bg-surface-container-high focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary focus:border-primary border-transparent rounded-lg font-body-md text-body-md text-on-surface transition-colors placeholder:text-outline" id="password" name="password" placeholder="Masukkan password" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between pt-2 pb-4">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-4 h-4 rounded border-outline text-primary focus:ring-primary focus:ring-offset-background bg-surface-container" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Ingat Saya</span>
</label>
<a class="font-title-sm text-[14px] leading-[20px] font-semibold text-primary hover:text-primary-container transition-colors" href="#">Lupa Password?</a>
</div>
<!-- Submit Button -->
<button class="w-full min-h-[44px] bg-primary hover:bg-primary-container text-on-primary font-title-sm text-title-sm rounded-lg py-3 flex items-center justify-center gap-2 transition-all active:scale-[0.98] shadow-sm shadow-primary/20 hover:shadow-md hover:shadow-primary/30" type="submit">
<span>Masuk</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Footer Help -->
<div class="mt-stack-lg text-center relative z-10">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Butuh bantuan akses? <a class="text-primary hover:underline font-semibold" href="#">Hubungi Admin IT</a>
</p>
</div>
</main>
</body></html>
